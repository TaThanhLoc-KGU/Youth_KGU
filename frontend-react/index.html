  <body>
    <div id="root">
      <!-- Màn hình chào tĩnh (Hiện ngay lập tức trước khi React kịp load) -->
      <style>
        .initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #f9fafb;
          z-index: 9999;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .loader-logo {
          width: 80px;
          height: 80px;
          margin-bottom: 20px;
          animation: pulse 2s infinite ease-in-out;
        }
        .loader-spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #e5e7eb;
          border-top: 3px solid #2563eb;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }
        .loader-text {
          margin-top: 16px;
          color: #4b5563;
          font-size: 14px;
          font-weight: 500;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.1); opacity: 0.8; }
        }
      </style>
      <div class="initial-loader">
        <img src="https://upload.wikimedia.org/wikipedia/vi/0/09/Huy_Hi%E1%BB%87u_%C4%90o%C3%A0n.png" class="loader-logo" alt="Logo">
        <div class="loader-spinner"></div>
        <div class="loader-text">Đang khởi động hệ thống...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

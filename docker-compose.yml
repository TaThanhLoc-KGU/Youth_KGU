# ============================================================

# Docker Compose for Face Attendance System

# Services: MySQL, Backend, Frontend

# ============================================================



version: '3.8'



services:

  # ============================================================

  # MySQL Database

  # ============================================================

  mysql:

    image: mysql:8.0

    container_name: youth-kgu-mysql

    environment:

      MYSQL_ROOT_PASSWORD: root

      MYSQL_DATABASE: face_attendance_activity

      MYSQL_USER: myuser

      MYSQL_PASSWORD: secret

      TZ: 'Asia/Ho_Chi_Minh'

    ports:

      - "3306:3306"

    volumes:

      # Persist database data

      - mysql_data:/var/lib/mysql

      # Optional: Mount SQL init scripts

      # - ./db-init:/docker-entrypoint-initdb.d

    networks:

      - attendance-network

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]

      timeout: 20s

      retries: 10

      interval: 10s

    restart: unless-stopped



  phpmyadmin:

    image: phpmyadmin:latest

    container_name: phpmyadmin-dashboard

    restart: always

    environment:

      PMA_HOST: mysql

      MYSQL_ROOT_PASSWORD: root

    ports:

      - '8081:80'

    depends_on:

      - mysql
    networks:

      - attendance-network



  # ============================================================

  # Spring Boot Backend

  # ============================================================

  backend:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: youth-kgu-backend

    environment:

      # Database connection

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/face_attendance_activity?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true

      SPRING_DATASOURCE_USERNAME: myuser

      SPRING_DATASOURCE_PASSWORD: secret

      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      

      # JPA/Hibernate

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_JPA_SHOW_SQL: 'false'

      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQL8Dialect

      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: 'false'

      

      # Server

      SERVER_PORT: 8080

      SPRING_APPLICATION_NAME: Activity Attendance System

      

      # File uploads

      QR_CODE_STORAGE_PATH: /app/uploads/qrcodes

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB

      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 10MB

      SPRING_SERVLET_MULTIPART_LOCATION: /app/uploads/temp

      

      # JWT (Set your own values in production!)

      JWT_SECRET: QYy0wNoeGemcPHjmaBkm+epqyvAwdicu/pqbCjItiWoowerJT8ZRyqiv8adtu6iPFWgakx+GAR36tU406+pKzP24UTrNc4iF4VptdaUS05rlXkcThrrxxBVVwqDdEe4X42fLFNsUfhTs5+ZkXSu6rzj2ekH9gicIcQ+JShdpquawDfWOE1CNhA9Icdx/SRLCsNdErWfuUOE4a04Q4Znl6oTOevb6eV9EZ3S5jupxdOhP/iI+0ssKKDQwE3uomWp/

      JWT_EXPIRATION: 8640000000000

      JWT_REFRESH_TOKEN_EXPIRATION: 604800000000

      # Web Push VAPID (generate: npx web-push generate-vapid-keys)
      APP_VAPID_PUBLIC_KEY: REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY

      APP_VAPID_PRIVATE_KEY: REPLACE_WITH_YOUR_VAPID_PRIVATE_KEY

      APP_VAPID_SUBJECT: mailto:admin@youthkgu.edu.vn

    

    ports:

      - "8080:8080"

    

    depends_on:

      mysql:

        condition: service_healthy

    

    volumes:

      # Persist uploads directory

      - backend_uploads:/app/uploads

      # Mount logs directory

      - ./logs:/app/logs

    

    networks:

      - attendance-network

    

    healthcheck:

      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]

      timeout: 20s

      retries: 5

      interval: 30s

      start_period: 40s

    

    restart: unless-stopped



  # ============================================================

  # React Frontend

  # ============================================================

  frontend:

    build:

      context: ./frontend-react

      dockerfile: Dockerfile

    container_name: youth-kgu-frontend

    environment:

      # Backend API endpoint for the browser (or use relative path)

      VITE_API_URL: http://localhost:8080

    

    ports:

      - "3000:3000"

    

    depends_on:

      - backend

    

    networks:

      - attendance-network

    

    healthcheck:

      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]

      timeout: 10s

      retries: 3

      interval: 30s

      start_period: 10s

    

    restart: unless-stopped



# ============================================================

# Networks

# ============================================================

networks:

  attendance-network:

    driver: bridge



# ============================================================

# Volumes

# ============================================================

volumes:

  mysql_data:

    driver: local

  backend_uploads:

    driver: local
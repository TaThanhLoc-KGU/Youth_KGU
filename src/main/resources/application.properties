# =====================================================
# application.properties - UNIFIED CONFIG (dev + prod)
# Env vars override defaults → Docker/VM chỉ cần set env
# =====================================================

# ===== Server Configuration =====
server.port=${SERVER_PORT:8080}

# ===== API Key (webhook protection) =====
# Bật: app.api-key.enabled=true + set APP_API_KEY env var trên server
app.api-key.enabled=${API_KEY_ENABLED:false}
app.api-key.secret=${APP_API_KEY:}
server.servlet.context-path=/
spring.application.name=Activity Attendance
# Đọc X-Forwarded-For / X-Real-IP từ reverse proxy (Nginx)
server.forward-headers-strategy=native

# ===== Database Configuration =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/youth-kgu?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
springdoc.cache.disabled=true
spring.jackson.serialization.fail-on-empty-beans=false

# JPA/Hibernate
# validate: Flyway quản lý schema, Hibernate chỉ kiểm tra (không ALTER TABLE)
#spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.hibernate.ddl-auto=update
# ===== Flyway Migration =====
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:28}
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# dialect tự detect từ MySQL driver (MySQL8Dialect deprecated từ Hibernate 6)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# ===== HikariCP Connection Pool =====
spring.datasource.hikari.pool-name=YouthKGU-Pool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== Tomcat Thread Pool =====
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=150
server.tomcat.connection-timeout=20000

# ===== Gzip Compression =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2048

# ===== JWT Configuration =====

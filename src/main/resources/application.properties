jwt.expiration=${JWT_EXPIRATION:604800000}
jwt.refresh-token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

# ===== Upload Path (shared by ALL services) =====
# Production: set APP_UPLOAD_PATH=/opt/youth-kgu/backend/uploads
# Dev: default = ./uploads (relative to working dir)
app.upload.path=${APP_UPLOAD_PATH:./uploads}

# ===== QR Code Configuration =====
# qr.code.storage.path ĐÃ XÓA — QRCodeService nay dùng app.upload.path/qrcodes
qr.code.width=300
qr.code.height=300

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.location=${APP_UPLOAD_PATH:./uploads}/temp

# ===== Swagger/OpenAPI =====
# PRODUCTION: set SWAGGER_ENABLED=false trong env để tắt Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===== Logging =====
logging.level.root=WARN
logging.level.com.tathanhloc.youthkgu=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/activity-attendance.log}
logging.file.max-size=20MB
logging.file.max-history=15
logging.logback.rollingpolicy.total-size-cap=200MB

# ===== Jackson Configuration =====
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Actuator (Health Check) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== Email Configuration =====
# Các giá trị này là fallback khi DB chưa có cấu hình (CauHinhEmailService sẽ override từ DB)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:noreply@kgu.edu.vn}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# app.mail.enabled=false → log ra console (mặc định); true → gửi thật
# Runtime control nay qua DB (cau_hinh_email.kich_hoat), biến này chỉ để tham khảo
app.mail.enabled=${MAIL_ENABLED:false}
app.name=Hệ thống Quản lý Hoạt động Đoàn - Hội KGU

# ===== Web Push / VAPID Configuration =====
# Không bắt buộc set thủ công — nếu để trống, WebPushService tự sinh 1 cặp khóa khi khởi động
# lần đầu và lưu vào {app.secure-data.path}/vapid-keys.properties để tái sử dụng ổn định.
# Chỉ cần set 2 biến dưới nếu muốn tự quản lý key (vd: npx web-push generate-vapid-keys).
# QUAN TRỌNG: không đổi key sau khi đã deploy (mọi subscription cũ sẽ hỏng).
app.vapid.public-key=${APP_VAPID_PUBLIC_KEY:}
app.vapid.private-key=${APP_VAPID_PRIVATE_KEY:}
app.vapid.subject=${APP_VAPID_SUBJECT:mailto:admin@youthkgu.edu.vn}

# ===== Secure data path (KHÔNG serve công khai — khác app.upload.path) =====
# Dùng cho dữ liệu nhạy cảm không được lộ qua GET /uploads/** (vd: VAPID private key tự sinh).
app.secure-data.path=${APP_SECURE_DATA_PATH:./secure-data}

# ===== SePay Webhook Configuration =====
# Đăng ký webhook tại: https://my.sepay.vn → Tài khoản ngân hàng → Webhook
# Webhook URL: https://tuoitre.vnkgu.edu.vn/api/clb/webhook/sepay
# apiKey lấy từ SePay dashboard → dán vào biến môi trường SEPAY_API_KEY
sepay.api-key=${SEPAY_API_KEY:}
# Thông tin tài khoản ngân hàng hiển thị QR cho sinh viên
sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:DOAN HUU THANH NIEN KGU}


# =====================================================
# application.properties - COMPLETE CONFIGURATION
# =====================================================

# ===== Server Configuration =====
server.port=8080
server.servlet.context-path=/
spring.application.name=Activity Attendance

# ===== Database Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/youth-kgu?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
springdoc.cache.disabled=true
spring.jackson.serialization.fail-on-empty-beans=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# ===== HikariCP Connection Pool =====
# Tối ưu cho 200-300 người đồng thời
spring.datasource.hikari.pool-name=YouthKGU-Pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== Tomcat Thread Pool =====
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=150
server.tomcat.connection-timeout=20000

# ===== Gzip Compression =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2048


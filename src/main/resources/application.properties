# Thông tin tài khoản ngân hàng hiển thị QR cho sinh viên
sepay.bank-code=${SEPAY_BANK_CODE:MBBank}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.account-holder=${SEPAY_ACCOUNT_HOLDER:DOAN HUU THANH NIEN KGU}


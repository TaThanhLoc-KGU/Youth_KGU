# =====================================================
# application-prod.properties - PRODUCTION CONFIG
# Kích hoạt: --spring.profiles.active=prod
# (hoặc SPRING_PROFILES_ACTIVE=prod trong env)
# =====================================================

# ===== Server Configuration =====
server.port=8080
server.servlet.context-path=/
spring.application.name=Activity Attendance

# ===== Database Configuration =====
spring.datasource.url=jdbc:mysql://localhost:3306/youth-kgu?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=youthkgu
spring.datasource.password=Youthkgu@2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
springdoc.cache.disabled=true
spring.jackson.serialization.fail-on-empty-beans=false

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.open-in-view=false

# ===== HikariCP Connection Pool =====
spring.datasource.hikari.pool-name=YouthKGU-Pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# ===== Tomcat Thread Pool =====
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=150
server.tomcat.connection-timeout=20000

# ===== Gzip Compression =====
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=2048

# ===== JWT Configuration =====
jwt.secret=YUyaPfk0c4xYbTlJoMbKMMQSZYzh/4WIkM3P0nqbXa47PzxH1HY2VxjgbkUk4NZbaavixJJ+Sp6zsOhwd0RFNg==
jwt.expiration=86400000
jwt.refresh-token.expiration=604800000

# ===== QR Code Configuration =====
qr.code.storage.path=/opt/youth-kgu/uploads/qrcodes
qr.code.width=300
qr.code.height=300

# ===== File Upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.location=/opt/youth-kgu/uploads/temp

# ===== Swagger/OpenAPI =====
# Tắt Swagger ở production để tránh lộ API docs
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ===== Logging =====
logging.level.root=WARN
logging.level.com.tathanhloc=INFO
logging.level.com.tathanhloc.youthkgu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=/opt/youth-kgu/logs/app.log
logging.file.max-size=20MB
logging.file.max-history=15
logging.logback.rollingpolicy.total-size-cap=200MB

# ===== Jackson Configuration =====
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== Actuator (Health Check) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ===== Email Configuration =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REPLACE_WITH_EMAIL
spring.mail.password=REPLACE_WITH_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Web Push / VAPID Configuration =====
# Tạo key: npx web-push generate-vapid-keys
# QUAN TRỌNG: không đổi key sau khi đã deploy (subscription cũ sẽ hỏng)
app.vapid.public-key=REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY
app.vapid.private-key=REPLACE_WITH_YOUR_VAPID_PRIVATE_KEY
app.vapid.subject=mailto:admin@youthkgu.edu.vn

# Local backend uses the MySQL container started by dev.ps1.
spring.datasource.url=jdbc:mysql://127.0.0.1:${DEV_DB_PORT:3307}/youth-kgu?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
spring.datasource.username=${DEV_DB_USER:youthkgu_dev}
spring.datasource.password=${DEV_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=SKIP
spring.flyway.enabled=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
app.upload.path=./uploads
app.mail.enabled=false
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
logging.file.name=.dev/backend.log
spring.docker.compose.enabled=false
